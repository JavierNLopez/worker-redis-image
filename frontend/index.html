<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
        width=device-width,
        initial-scale=1.0
        "
    >

    <title>
        Procesador Distribuido
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <h1>
            🚀 Procesador Distribuido
            de Imágenes
        </h1>

        <!-- DASHBOARD -->

        <div class="dashboard">

            <div class="dashboard-card">

                <h2 id="workersCount">
                    0
                </h2>

                <p>
                    Workers Activos
                </p>

            </div>

            <div class="dashboard-card">

                <h2 id="pendingJobs">
                    0
                </h2>

                <p>
                    Tareas Pendientes
                </p>

            </div>

            <div class="dashboard-card">

                <h2 id="completedJobs">
                    0
                </h2>

                <p>
                    Tareas Completadas
                </p>

            </div>

        </div>

        <!-- DROP ZONE -->

        <div
            class="drop-zone"
            id="dropZone"
        >

            <h2>
                Arrastra una imagen aquí
            </h2>

            <p>
                o selecciona un archivo
            </p>

            <input
                type="file"
                id="fileInput"
                accept="image/*"
            >

            <br>

            <button
                onclick="uploadImage()"
            >
                Subir Imagen
            </button>

        </div>

        <!-- TASKS -->

        <div id="tasks">

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
