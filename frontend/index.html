<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Procesador Distribuido</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Procesador Distribuido de Imágenes</h1>

        <div class="stats">

            <div class="card">
                <h2 id="workers">0</h2>
                <p>Workers</p>
            </div>

            <div class="card">
                <h2 id="queued">0</h2>
                <p>En cola</p>
            </div>

            <div class="card">
                <h2 id="completed">0</h2>
                <p>Completadas</p>
            </div>

        </div>

        <div class="upload-box" id="uploadBox">

            <h2>📂 Arrastra imágenes o carpetas aquí</h2>

            <input
                type="file"
                id="imageInput"
                multiple
                webkitdirectory
                directory
            >

            <button onclick="uploadImage()">
                Subir Imágenes
            </button>

        </div>

        <div class="section">

            <h2>📋 Tareas</h2>

            <div id="tasks"></div>

        </div>

        <div class="section">

            <h2>🖥 Logs en tiempo real</h2>

            <div id="logs"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
